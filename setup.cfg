[metadata]
name = ImSwitch
version = attr: imswitch.__version__
author = Xavier Casas Moreno
author_email = xaviercm@kth.se
description = Microscopy control
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/kasasxav/ImSwitch
project_urls =
    Bug Tracker = https://github.com/kasasxav/ImSwitch/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = True
python_requires = ~=3.9
install_requires =
    coloredlogs == 15
    colour-science ~= 0.3
    dataclasses-json ~= 0.5
    h5py ~= 3.0
    pyvisa-py==0.4.1
    lantzdev[qt] ~= 0.5.2
    luddite ~= 1.0
    napari[pyqt5] == 0.4.7
    nidaqmx ~= 0.5.7
    numpy ~= 1.19
    PyQt5 ~= 5.15.2
    pyqtgraph ~= 0.12.1
    microscope
    pyserial ~= 3.4
    QDarkStyle ~= 3.0
    QScintilla ~= 2.12
    qtpy ~= 2.0
    requests ~= 2.25
    scikit-image ~= 0.19.0
    Send2Trash ~= 1.8
    tifffile ~= 2022.0
    ome_zarr ~= 0.6.1
    Pyro5 ~= 5.14
    fastAPI ~= 0.86.0
    uvicorn[standard] ~= 0.19.0
    matplotlib ~= 3.6
    opencv-python ~=4.5.3
    vispy==0.9.4

[options.entry_points]
console_scripts =
    imswitch = imswitch.__main__:main
